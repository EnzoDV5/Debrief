server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Same idea as the Vite dev proxy and the Vercel rewrite: the browser only talks to this
  # origin, and /api is forwarded to the api container, so cookies stay first-party.
  location /api/ {
    # nginx's default limit is 1 MB, which a 1 MB transcript plus multipart overhead exceeds.
    # Allow a little more so the api (which enforces the real 1 MB limit) answers with its own
    # clear JSON error instead of nginx's HTML page.
    client_max_body_size 2m;
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Single-page app: unknown paths (e.g. /meetings/123) get index.html and React Router
  # decides what to show.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
