services:
  - type: web
    name: debrief-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: '2'
      - key: WEB_ORIGIN
        value: https://debriefweb.netlify.app
      - key: APP_URL
        value: https://debriefweb.netlify.app
      - key: GOOGLE_REDIRECT_URI
        value: https://debriefweb.netlify.app/api/integrations/google/callback
      - key: GOOGLE_AUTH_REDIRECT_URI
        value: https://debriefweb.netlify.app/api/auth/google/callback
      - key: DATABASE_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: EMAILJS_SERVICE_ID
        sync: false
      - key: EMAILJS_TEMPLATE_ID
        sync: false
      - key: EMAILJS_PUBLIC_KEY
        sync: false
      - key: EMAILJS_PRIVATE_KEY
        sync: false
      - key: EMAILJS_WELCOME_TEMPLATE_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
