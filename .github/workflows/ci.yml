name: CI

on:
  push:
  pull_request:

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    # Throwaway Postgres for the api tests (same version as local Docker and Supabase).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: debrief
          POSTGRES_PASSWORD: debrief
          POSTGRES_DB: debrief_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U debrief -d debrief_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
