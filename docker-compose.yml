name: debrief

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: debrief
      POSTGRES_PASSWORD: debrief
      POSTGRES_DB: debrief
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U debrief -d debrief']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://debrief:debrief@db:5432/debrief
      WEB_ORIGIN: http://localhost:8080
      TRUST_PROXY: 1
      GOOGLE_REDIRECT_URI: http://localhost:8080/api/integrations/google/callback
      GOOGLE_AUTH_REDIRECT_URI: http://localhost:8080/api/auth/google/callback
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '8080:80'
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
